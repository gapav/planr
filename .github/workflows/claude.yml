name: Claude

# Two ways in:
#   build   — add the `agent` label to an issue: Claude builds it and opens a PR.
#   respond — write `@claude …` in an issue or PR comment or review: Claude
#             answers or pushes fixes to that PR's branch.
# Only the repository owner can trigger either. Claude never pushes to `main`
# (a push there deploys production) and has no database credentials.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  build:
    if: github.event_name == 'issues' && github.event.label.name == 'agent' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Card → In progress
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: .github/scripts/project-status.sh ${{ github.event.issue.number }} "In progress"
      - run: npm ci
        working-directory: site
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Edit,Write,Read,Glob,Grep,Task,TodoWrite,Bash(npm ci),Bash(npm test),Bash(npm run lint),Bash(npm run build),Bash(npm run db:bootstrap),Bash(npx vitest run *),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git add *),Bash(git commit *),Bash(git checkout -b *),Bash(git switch -c *),Bash(git push -u origin agent/*),Bash(git push origin agent/*),Bash(gh issue view *),Bash(gh issue comment *),Bash(gh pr create *),Bash(gh pr view *),Bash(ls *),Bash(cat *)"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}

            You are building this issue end to end, unattended, and finishing with
            a pull request. Read the issue with `gh issue view ${{ github.event.issue.number }} --comments`.
            Follow CLAUDE.md, site/AGENTS.md and the .claude/rules/ notes for the
            files you touch. Their hard rules hold without exception: never touch a
            database, never edit an applied migration, never push to `main`.

            The issue is the spec: its "Done when" lines are what you must prove.

            0. If the issue is too vague to build safely — no checkable "Done when",
               or a choice only the maintainer can make — do not guess. Comment on
               the issue with the specific questions (`gh issue comment`) and stop.
            1. Branch: `git switch -c agent/${{ github.event.issue.number }}-short-name`.
            2. Build it. New behaviour in lib/ comes with a focused test. A schema
               change is a new file in site/supabase/migrations/ plus
               `npm run db:bootstrap`, a `pending` row (dev and prod) in the
               DEPLOYMENT.md ledger, and an rls.test.sql update if access changes.
            3. Finish the way /ship does (.claude/skills/ship/SKILL.md): from site/
               run `npm run lint`, `npm test`, `npm run build` and fix failures; run
               the spec-reviewer agent with the issue text, and the db-reviewer
               agent if anything under site/supabase/ or site/app/api/ changed; fix
               what they find.
            4. Commit (stage files by name, message `summary (#${{ github.event.issue.number }})`),
               push with `git push -u origin agent/${{ github.event.issue.number }}-short-name`,
               and open the PR with `gh pr create --base main`, title
               `summary (#${{ github.event.issue.number }})`, body filled in from
               .github/pull_request_template.md. Merging deploys production, so the
               "Before merging" list must name every migration file (in order),
               environment variable and setting the change needs.
      # No PR came of it (the agent asked questions, or the run failed): the card
      # goes back to Ready. With a PR, the board's own workflow has already moved
      # it to In review.
      - name: Card → Ready if there is no PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_TOKEN: ${{ github.token }}
        run: |
          prs=$(GH_TOKEN="$PR_TOKEN" gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("agent/${{ github.event.issue.number }}-"))] | length')
          if [ "$prs" = "0" ]; then
            .github/scripts/project-status.sh ${{ github.event.issue.number }} "Ready"
          else
            echo "PR open for #${{ github.event.issue.number }}; leaving the card to the board."
          fi

  respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: agent/
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Edit,Write,Read,Glob,Grep,Task,TodoWrite,Bash(npm ci),Bash(npm test),Bash(npm run lint),Bash(npm run build),Bash(npm run db:bootstrap),Bash(npx vitest run *),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(git show *)"
