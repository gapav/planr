<h2>Logg inn på Grep</h2>
<p>Åpne den sikre engangslenken for å fortsette:</p>
<p>
  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email">
    Fortsett til Grep
  </a>
</p>
<p>På neste side bekrefter du innloggingen med ett trykk. Nettleseren husker deg, så du trenger vanligvis ikke en ny e-post ved neste besøk.</p>
<p>Hvis du ikke ba om denne e-posten, kan du trygt se bort fra den.</p>
