# Configuration as code for Grep's hosted Supabase projects and optional local
# stack. Keep credentials out of this file; the CLI deliberately cannot export
# masked provider and SMTP secrets from a hosted project.
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "site"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[db.pooler]
enabled = false
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 200

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[storage.analytics]
enabled = true
max_namespaces = 10
max_tables = 10
max_catalogs = 2

[auth]
enabled = true
site_url = "https://grep.team"
additional_redirect_urls = ["https://grep.team/auth/confirm", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6

[auth.rate_limit]
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Hosted Apple, Twilio and SMTP blocks are intentionally absent. Supabase masks
# their credentials when pulling remote config, and declaring incomplete blocks
# would make `config push` disable or invalidate the working hosted setup.
# Add them only with env(...) references when their secrets are managed outside
# Git and deliberately shared with the target environment.

[remotes.development]
project_id = "hgjboxsgemvgrlyemudt"

[remotes.development.auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

# The free-tier development project uses Supabase's default mail provider,
# which rejects hosted template updates. Production has custom SMTP and can
# therefore keep the app-owned, scanner-safe magic-link template under code
# management. Add the same block under `remotes.development` after configuring
# custom SMTP for that project.
[remotes.production]
project_id = "fbbqdutatetfkybvlozx"

[remotes.production.auth.email.template.magic_link]
subject = "Logg inn på Grep"
content_path = "./supabase/templates/magic-link.html"
