<!doctype html>
<!--
  Source for app/opengraph-image.png — the 1200x630 card Messenger, Slack, iMessage
  and the rest show when someone shares a grep.team link.

  It is a plain page rather than a next/og route because the card leans on the same
  variable DM Sans the site uses, and Satori needs static font instances. To redraw
  the card after a brand change:

      cd site && python3 -m http.server 4321
      # open http://localhost:4321/scripts/opengraph-image.html
      # screenshot the 1200x630 viewport, save as site/app/opengraph-image.png

  Next hashes the file's URL, so a new render invalidates the old og:image on its own —
  but Facebook/Messenger caches the *page*, so re-scrape grep.team/velkommen in the
  Sharing Debugger afterwards.
-->
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Grep — open graph card</title>
<style>
  @font-face {
    font-family: "Grep DM Sans";
    src: url("../public/fonts/dm-sans-latin-variable.ttf") format("truetype-variations");
    font-weight: 100 1000;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #faf8f4; }
  body { display: grid; place-items: start; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #faf8f4;
    color: #2e1b3d;
    font-family: "Grep DM Sans", sans-serif;
    line-height: 1.5;
  }
  .court {
    position: absolute;
    top: 76px;
    right: -44px;
    width: 552px;
    height: 478px;
    overflow: hidden;
    border-radius: 200px 34px 34px 34px;
  }
  .court svg { display: block; width: 100%; height: 100%; }
  .copy {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 62px 0 62px 76px;
    width: 700px;
  }
  .logo { width: 196px; color: #2e1b3d; }
  .logo svg { display: block; width: 100%; height: auto; }
  .block { margin-block: auto; }
  .eyebrow {
    font-size: 19px;
    font-weight: 750;
    letter-spacing: .12em;
  }
  h1 {
    margin: 24px 0 0;
    font-size: 112px;
    font-weight: 800;
    letter-spacing: -.042em;
    line-height: 1.02;
  }
  h1 span { position: relative; isolation: isolate; }
  h1 span::after {
    content: "";
    position: absolute;
    left: 0;
    right: -.08em;
    bottom: .155em;
    height: .165em;
    border-radius: 100px;
    background: #ffb28a;
    z-index: -1;
  }
  .lead {
    margin-top: 30px;
    font-size: 31px;
    font-weight: 500;
    line-height: 1.35;
    letter-spacing: -.02em;
  }
  .foot {
    padding-top: 30px;
    font-size: 21px;
    font-weight: 650;
    color: #706479;
  }
</style>
</head>
<body>
<div class="card">
  <div class="court">
    <svg viewBox="0 0 664 450" preserveAspectRatio="xMidYMid slice" fill="none">
      <path d="M0 0H664V450H0Z" fill="#e9ddf7" />
      <g transform="translate(664 0) scale(-1 1)">
        <path d="M-12 103 C98 137 242 211 307 291 C340 331 351 392 338 462 L-12 462Z" fill="#ffb28a" />
      </g>
      <g transform="translate(664 0) scale(-1 1)" stroke="#fffefd" stroke-width="4" stroke-linecap="round" opacity=".86">
        <path d="M-12 103 C98 137 242 211 307 291 C340 331 351 392 338 462" />
        <path d="M-14 9 C172 12 371 93 500 198 C593 274 633 354 650 458" stroke-dasharray="15 21" stroke-width="3" />
        <path d="M178 137L223 159" />
      </g>
    </svg>
  </div>
  <div class="copy">
    <div class="logo">
      <!-- components/logo.tsx, LogoArtwork -->
      <svg viewBox="318 156 894 274" fill="currentColor">
        <path d="M322 239 Q322 214 349 202 L445 162 Q473 152 495 173 L547 226 Q539 234 526 223 L488 187 Q475 174 467 185 L370 323 Q362 333 372 337 Q375 339 385 333 L533 254 Q557 240 565 266 Q568 275 568 285 L568 337 Q568 362 547 372 L425 422 Q393 435 367 419 Q322 395 322 351Z" />

        <path d="M797 346 L797 260 C797 225 819 201 851 201 L882 201 Q886 201 886 205 L886 226 Q886 238 874 238 L866 238 C851 238 841 247 841 263 L841 346 Q841 350 837 350 L801 350 Q797 350 797 346Z" />
        <path fill-rule="evenodd" d="M1032 257 Q1034 261 1028 263 L928 303 C946 323 973 322 992 299 Q996 294 1000 297 L1025 309 Q1030 311 1027 316 C1011 341 989 353 961 353 C914 353 879 320 879 275 C879 232 913 197 960 197 C997 197 1023 222 1032 257Z M919 274 L986 246 C978 236 970 233 960 233 C937 233 919 252 919 274Z" />

      </svg>
    </div>
    <div class="block">
      <p class="eyebrow">ET LITE GREP. EN GOD ØKT.</p>
      <h1>Mer tid<br>til <span>laget.</span></h1>
      <p class="lead">Planlegg hjemme.<br>Vær til stede på trening.</p>
    </div>
    <p class="foot">Øvelsesbank og øktplan for håndballtrenere</p>
  </div>
</div>
</body>
</html>
